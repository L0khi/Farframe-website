<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" role="img" aria-labelledby="title desc"><title id="title">FloorSight proposed system architecture</title><desc id="desc">RFID tags feed forklift and handheld readers, then a reader interface and detection processor. Registration and a zone reference inform the database. The operator searches material records. Site validation is required.</desc><rect width="1000" height="740" fill="#19212A"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#91B5B4"/></marker></defs><g font-family="Arial,sans-serif" fill="#F7F8F7"><text x="44" y="42" font-size="16" letter-spacing="2">FARFRAME / FLOORSIGHT</text><text x="44" y="74" font-size="25" font-weight="700">Proposed system architecture</text><g fill="none" stroke="#91B5B4" stroke-width="2" marker-end="url(#arrow)"><path d="M500 178V192H220V214"/><path d="M500 178V192H780V214"/><path d="M220 286V303H500V320"/><path d="M780 286V303H500V320"/><path d="M500 392V420"/><path d="M500 492V520"/><path d="M300 456H348"/><path d="M700 556H652"/><path d="M500 592V620"/></g><rect x="350" y="106" width="300" height="72" rx="3" fill="#24303A" stroke="#6C9292"/><text x="500" y="135" text-anchor="middle" font-size="18" font-weight="700">Registered RFID tags</text><text x="500" y="160" text-anchor="middle" font-size="14" fill="#CADADB">Parts / pallets / containers</text><rect x="70" y="214" width="300" height="72" rx="3" fill="#24303A" stroke="#6C9292"/><text x="220" y="243" text-anchor="middle" font-size="18" font-weight="700">Forklift reader</text><text x="220" y="268" text-anchor="middle" font-size="14" fill="#CADADB">Observations during movement</text><rect x="630" y="214" width="300" height="72" rx="3" fill="#24303A" stroke="#6C9292"/><text x="780" y="243" text-anchor="middle" font-size="18" font-weight="700">Handheld reader</text><text x="780" y="268" text-anchor="middle" font-size="14" fill="#CADADB">Targeted nearby search</text><rect x="350" y="320" width="300" height="72" rx="3" fill="#24303A" stroke="#6C9292"/><text x="500" y="349" text-anchor="middle" font-size="18" font-weight="700">Reader interface</text><text x="500" y="374" text-anchor="middle" font-size="14" fill="#CADADB">Reader ID / tag ID / time</text><rect x="350" y="420" width="300" height="72" rx="3" fill="#24303A" stroke="#6C9292"/><text x="500" y="449" text-anchor="middle" font-size="18" font-weight="700">Detection processing</text><text x="500" y="474" text-anchor="middle" font-size="14" fill="#CADADB">Filter repeats / associate zone</text><rect x="20" y="420" width="280" height="72" rx="3" fill="#24303A" stroke="#6C9292"/><text x="160" y="449" text-anchor="middle" font-size="18" font-weight="700">Zone reference</text><text x="160" y="474" text-anchor="middle" font-size="14" fill="#CADADB">Required for zone assignment</text><rect x="350" y="520" width="300" height="72" rx="3" fill="#24303A" stroke="#6C9292"/><text x="500" y="549" text-anchor="middle" font-size="18" font-weight="700">Local database</text><text x="500" y="574" text-anchor="middle" font-size="14" fill="#CADADB">Materials / observations / zones</text><rect x="700" y="520" width="280" height="72" rx="3" fill="#24303A" stroke="#6C9292"/><text x="840" y="549" text-anchor="middle" font-size="18" font-weight="700">Tag registration</text><text x="840" y="574" text-anchor="middle" font-size="14" fill="#CADADB">Tag ID linked to material</text><rect x="350" y="620" width="300" height="72" rx="3" fill="#24303A" stroke="#6C9292"/><text x="500" y="649" text-anchor="middle" font-size="18" font-weight="700">Operator search screen</text><text x="500" y="674" text-anchor="middle" font-size="14" fill="#CADADB">Part number / last observation</text><text x="44" y="724" font-size="13" fill="#CADADB">CONCEPT STAGE · Coverage and location methods require site validation.</text></g></svg>